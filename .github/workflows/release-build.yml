name: Release build

# Builds the self-contained macOS app (adb from AOSP source, libusb, native
# thumbnails), packages it, runs the package checks and the packaged-app smoke test,
# and uploads the .dmg/.zip as workflow artifacts. It is manual (workflow_dispatch) and
# never creates a tag or a release. It is deliberately NOT triggered by tags: a v* tag is
# pushed when a release is published from artifacts that were already built and verified,
# and a tag-triggered rebuild would produce different files and a second, competing release.
# Publish with the procedure in docs/RELEASING.md.
#
# Signing is optional and driven by repository secrets. Without them the build is
# UNSIGNED and says so. To sign and notarize, add these secrets (see docs/RELEASING.md):
#   CSC_LINK, CSC_KEY_PASSWORD                      Developer ID Application certificate (.p12, base64)
#   APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER   App Store Connect API key for notarytool
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build tools for the native toolchain
        run: brew install cmake ninja pkgconf

      # The native toolchain takes ~20 minutes to compile; its inputs are fully pinned
      - name: Cache native toolchain
        uses: actions/cache@v4
        with:
          path: |
            native/.out
            native/.cache
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/versions.env', 'native/build.sh', 'native/thumb/**') }}

      - name: Install JavaScript dependencies (plain npm ci; the release ships no MTP addon)
        run: npm ci

      - name: Build native toolchain
        run: bash native/build.sh

      - name: Typecheck, tests, build
        run: npm run verify

      - name: Package, sign if credentials exist, and check
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm --prefix desktop run dist

      - name: Smoke-test the packaged app (minimal environment, offline)
        run: node desktop/driver.mjs --app desktop/release/mac-arm64/Droidwire.app

      - name: Checksums
        run: cd desktop/release && shasum -a 256 Droidwire-*.dmg Droidwire-*.zip | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: droidwire-macos-arm64
          path: |
            desktop/release/Droidwire-*.dmg
            desktop/release/Droidwire-*.zip
            desktop/release/SHA256SUMS
